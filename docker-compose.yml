version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: ipl_mongo_replset
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: test $$(echo "rs.initiate().ok || rs.status().ok" | mongosh --port 27017 --quiet) -eq 1
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
